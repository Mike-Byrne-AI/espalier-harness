name: Post-merge Windows leg
# Advisory: the serial test files (scripts/proof_tier.py's SERIAL_FILES, the
# files the local tier keeps off its parallel pool and runs at one worker) on
# windows-latest after each push to main. It gates nothing and reverts
# nothing: tools/cc/board.py reads its newest push run through
# tools/cc/_post_merge.py's base-run rule and prints a red on the board's
# checks: line in the legs' shape, `post-merge-windows (main, advisory): red
# since <sha> (run <id>)`, never on the main: line, whose red is the
# revert-first rule's. The board alone reads it (neither the ship preflight
# nor the SessionStart banner). A dispatched run carries workflow_dispatch and
# never clears that line: the next push run does, or a re-run of the red one.
#
# A separate workflow, never a second job in post-merge.yml: the proof's
# readers (board.py::read_post_merge, ship.py::base_red_after_merge) read a
# run's conclusion, and a run is red when any job fails, so a Windows flake
# inside the proof would turn main red and ask for a revert on every flake.
# tests/test_ci_job_bounds.py pins that, this file's name, its push trigger,
# no continue-on-error, the ceiling below and the bound.
#
# No concurrency group: two runs of it overlap when two merges land within one
# job's length, and each keeps its verdict, where a group with
# cancel-in-progress would cancel the older and leave it none. The job grows
# with SERIAL_FILES: 2.3 to 4.2 minutes over its first 34 push runs (from
# 2026-10-31 08:16Z), 4.1 to 6.3 over the 12 after the cited-pin run joined the
# list (#404), and 7.8 on the first after the axis registry's run did (#416,
# run 41343705282); 1 of the 46 consecutive pairs overlapped. Re-measured over
# the leg's first day (30 push runs), the queue had a median of 0.03 minutes
# and a worst of 0.25, where a median above 2, or a worst above 5, would have
# asked for a group with cancel-in-progress; all 47 push runs to 2026-11-01
# 19:49Z read the same.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only token; the job never pushes.
permissions:
  contents: read

jobs:
  serial-leg:
    runs-on: windows-latest
    # The serial files' longest own timeout mark (900 s, the PowerShell gate's
    # test_the_gate_completes_against_head; a mark outranks the ceiling below)
    # plus the ten minutes tests/test_ci_job_bounds.py gives the test-serial
    # cell on top of its worst mark. Twice the measured 3:59 would round to
    # ten and cut that mark with no test named, and five xdist worker restarts
    # at the ceiling below are fifteen.
    timeout-minutes: 25
    steps:
      # A shallow checkout, as the measured portability runs made it: no
      # serial file reads past commits or release tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e .[dev]

      - name: Run the full tier's serial leg
        # bash, as portability.yml runs on every runner: the Windows default is
        # PowerShell, with its own quoting. The file list is proof_tier.py's
        # SERIAL_FILES, read by the script, never restated here. The line runs
        # under xdist at one worker, so a per-test ceiling crossing names its
        # test and the controller replaces the worker (the script's own note).
        shell: bash
        env:
          # windows-latest is the slow host: the same per-test ceiling the
          # portability leg exports there, above the suite's 60 s; pytest-timeout
          # reads it ahead of the ini, and a test's own mark wins.
          PYTEST_TIMEOUT: "180"
          PYTEST_ADDOPTS: --durations=25
        run: python scripts/proof_tier.py --run --tier full --leg serial
