name: CI

# Pull requests only (plus a manual dispatch): every signal this workflow
# produces is read BEFORE the merge, on the PR's merge result, and main never
# re-runs it. The pairing of two PRs merged in sequence is covered by the
# protection's up-to-date rule (on since 2026-09-27): the second must be
# caught up to main before it merges, so its cells re-run on a head that
# carries the first. The cost is one `gh pr update-branch` per trailing PR,
# plus a marker re-bind when its title carries one (`/ship` step 5). This
# paragraph is hand-kept -- nothing here reads the live protection; the rule
# is listed among the settings to enable in docs/RELEASE_CHECKLIST.md. Before
# it was on, that pairing was tested each without the other, and a red from
# it surfaced on the next PR's run rather than on main. The `tier` job below
# decides how much of the suite a PR earns; the required `test (3.x)` cells
# then run exactly that minus its serial leg, their required `test-serial (3.x)`
# twins run that leg beside them (the wall-clock-budget files, alone on their
# own runner, took 8 to 14 minutes of every cell in series until 2026-09-30),
# and a changed test file always rides along, whatever the tier.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Read-only token; the test job never pushes.
permissions:
  contents: read

# Cancel previous CI run on the same ref when a new push lands.
concurrency:
  # Each EVENT gets its own group, so a run of one kind cannot cancel a run of
  # another on the same ref. The original case was a scheduled run -- it
  # executes on the default branch, so `github.ref` matches a push's and
  # `cancel-in-progress` let a push landing at the wrong minute kill it. The
  # property holds for `workflow_dispatch` too: a dispatched run shares the
  # push's ref, and a cancelled run is not a failed run -- nothing reports
  # that it did not happen.
  #
  # KEY ON THE EVENT ITSELF, never on a hand-written list of event names. The first
  # spelling here enumerated only `schedule` and let everything else fall through to
  # `push`, which put `workflow_dispatch` in the push bucket, and on 2026-09-01 a
  # manual dispatch cancelled an in-flight push run. The release checklist tells the
  # operator to dispatch these legs by hand, so the collision was reachable by
  # following the documented procedure. `github.event_name` cannot drift out of
  # step with a sibling condition because there is no second copy to maintain.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # ONE computation, the same one the local run prints: scripts/proof_tier.py
  # classifies the pull request's merge-base diff. A docs/tests/scripts change
  # earns the contract slice (minutes); a recall-corpus change earns that slice
  # plus the recall engine's own files; a runtime or workflow change earns the
  # full tier -- the parallel recipe the local `proof_tier.py --run` uses, with
  # the three wall-clock-budget files serial. The rule has one home (the script,
  # pinned by tests/test_proof_tier.py); this job only asks it.
  #
  # This job NEVER fails and never answers cheaper than the truth: a script
  # error, a shallow history, a dispatch with no PR base -- every one of those
  # reads as `full`, the tier that contains the other two. The `test` matrix
  # consumes the output through `needs` and defaults to `full` when the output
  # is empty, so the five required cells always report whatever happens here.
  tier:
    runs-on: ubuntu-latest
    outputs:
      tier: ${{ steps.compute.outputs.tier }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The merge-base with the PR base must be reachable.
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Compute the proof tier this pull request earns
        id: compute
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          tier=full
          if [ -n "$BASE_SHA" ]; then
            tier="$(python scripts/proof_tier.py --base "$BASE_SHA" --quiet || echo full)"
          fi
          case "$tier" in
            full|recall|contract) ;;
            *) tier=full ;;
          esac
          echo "tier=$tier" >> "$GITHUB_OUTPUT"
          {
            echo "## proof tier: \`$tier\`"
            echo
            echo '```'
            python scripts/proof_tier.py --base "${BASE_SHA:-HEAD}" --tier "$tier" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    needs: tier
    # Run even if `tier` errored: a required cell that never reports parks the
    # PR (see the matrix comment below). The env default covers an empty output.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    strategy:
      # A LITERAL five-cell list, never a `${{ }}` expression: branch protection
      # matches check-run names, the release checklist requires `test (3.10)`
      # ... `test (3.14)`, and tests/test_required_status_checks.py cannot model
      # a computed matrix. A required check that never reports does not fail a
      # PR, it parks it on "Expected -- waiting for status to be reported" with
      # no route to merge but deleting the rule.
      #
      # Read every cell: a red in one interpreter must not cancel the other four
      # (the 2026-09-24 witness lost three clean-checkout cells to fail-fast on
      # one runner-relative red, DEF-922). These five cells are the required
      # status checks, so a cancelled cell is a check that never reports.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Fetch full history + tags so the tag-coupled tests (sister-site
          # calibration corpus, CHANGELOG tag-parity) RUN here rather than
          # skip — the skip-guards keep fresh/adopter clones green.
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e .[dev]

      - name: Run the proof tier this pull request earns
        # `proof_tier.py --run` executes the tier's own recipe under one receipt:
        # contract = the tree-wide contracts; recall = those plus the recall
        # engine's files; full = mypy on the hooks, then `pytest -n auto` with
        # the wall-clock-budget files left out. `--leg parallel` is every line
        # but the serial one (the whole tier on the cheaper tiers); the serial
        # line runs in the `test-serial` twin below, on its own runner. The
        # `heavy_e2e` stages (tests/conftest.py::_HEAVY_E2E_TESTS) run in no
        # cell here: every pytest line deselects them (the cheaper tiers' own-tests
        # line included), and their one CI home is
        # the floor-version cell of clean-checkout.yml (`--heavy`). A dispatch
        # has no PR base and runs `full` against HEAD.
        env:
          TIER: ${{ needs.tier.outputs.tier || 'full' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PYTEST_ADDOPTS: --durations=25
        run: |
          echo "proof tier: $TIER"
          python scripts/proof_tier.py --run --tier "$TIER" --base "${BASE_SHA:-HEAD}" --leg parallel

      - name: Self-host check
        # --skip-self-host is belt-and-suspenders, NOT load-bearing for
        # classification: a fresh checkout classifies as source_checkout (the
        # self-host marker is gitignored .espalier/integrity.json, not the
        # committed .espalier/ dir), so the self-host strict gate never
        # false-fires here.
        run: espalier doctor . --skip-self-host

  # The serial leg of the tier -- the wall-clock-budget and timeout-near files
  # (scripts/proof_tier.py::SERIAL_FILES) -- on its own runner, beside the
  # parallel leg instead of after it. Those files false-fail under CPU
  # oversubscription, which is why they never join the `-n auto` run; alone on
  # a runner they run at their serial duration. Five required cells, the same
  # literal matrix as `test` and for the same reasons: branch protection
  # matches check-run names, and a cell that never reports parks the PR. On the
  # cheaper tiers the leg has nothing to run and says so in the receipt (exit
  # 0), so the required cell still reports.
  test-serial:
    needs: tier
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        # Only where the leg has something to run: on the cheaper tiers the
        # serial leg is empty and the script is stdlib, so five required cells
        # skip the install on a docs-only pull request (failure-mode review).
        if: ${{ (needs.tier.outputs.tier || 'full') == 'full' }}
        run: pip install -e .[dev]

      - name: Run the serial leg of the proof tier this pull request earns
        env:
          TIER: ${{ needs.tier.outputs.tier || 'full' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PYTEST_ADDOPTS: --durations=25
        run: |
          echo "proof tier: $TIER (serial leg)"
          python scripts/proof_tier.py --run --tier "$TIER" --base "${BASE_SHA:-HEAD}" --leg serial

  # The tagless-clone job lives in its own workflow
  # (.github/workflows/clean-checkout.yml), on the floor interpreter, with the
  # heavy stages: a required cell's re-run never waits on it, and four
  # full-suite executions per pull request went with it (2026-09-30).

  # The cross-OS `portability` job lives in its own workflow
  # (.github/workflows/portability.yml): it runs on a pull request when Python
  # or packaging source changes, and on demand. The static portability
  # contracts still run here on ubuntu on every pull request.

  # The ONLY job that installs ripgrep, and the sole environment in which the
  # rg-vs-python parity assertions execute at all.
  #
  # tests/test_scope_walker.py gates three tests on `shutil.which("rg")` and
  # NOTHING installed it anywhere -- so a backend reachable from shipped code
  # (`walk_references(..., use_ripgrep=True)` is the default, reached by
  # `espalier scope-check`) had its only coverage skip in every environment the
  # project controls. A green suite said nothing about it.
  #
  # Placement is deliberate, and the two obvious homes are both WRONG:
  #  - NOT `clean-checkout`: that job exists to reproduce a fresh-contributor
  #    clone, which does not have ripgrep. Installing it there would destroy the
  #    very environment the job is there to represent.
  #  - NOT `test`: that is a 5-interpreter matrix, and this parity is about two
  #    search backends agreeing, not about interpreter behaviour -- one runner
  #    proves it, five just pay for it 5x.
  # An apt-get in the `test` matrix would also exercise nothing on the cheaper
  # tiers: these tests carry the `slow` marker, which the contract slice never
  # selects, and the full tier's cells have no ripgrep to find.
  ripgrep-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e .[dev]

      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Confirm rg resolves (this is the gate the tests skip on)
        # Fail loudly here rather than let the suite skip silently: a skipped
        # parity test in the job that exists to run it is the exact failure
        # this job was added to end.
        run: |
          rg --version
          python -c "import shutil,sys; sys.exit(0 if shutil.which('rg') else 'rg not on PATH')"

      - name: Run the ripgrep parity tests
        # `-rs` so a skip is visible in the log; combined with the check above,
        # a skip here means the gate regressed rather than the tool is absent.
        run: python -m pytest tests/test_scope_walker.py -q -rs

  stdlib-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Check scanners are stdlib-only
        shell: python
        run: |
          import ast
          import sys
          from pathlib import Path

          STDLIB = sys.stdlib_module_names
          ALLOWLIST = {
              "os", "re", "sys", "ast", "json", "math", "pathlib", "typing",
              "collections", "itertools", "functools", "dataclasses",
              "abc", "enum", "io", "copy", "string", "textwrap", "warnings",
              "contextlib", "types", "operator", "hashlib", "struct",
              "__future__",
          }

          violations = []
          for f in Path("espalier/scanners").glob("*.py"):
              if f.name == "__init__.py":
                  continue
              tree = ast.parse(f.read_text())
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      for alias in node.names:
                          top = alias.name.split(".")[0]
                          if top not in STDLIB and top not in ALLOWLIST:
                              violations.append(f"{f.name}:{node.lineno} — {alias.name}")
                  elif isinstance(node, ast.ImportFrom):
                      if not node.module:
                          continue
                      top = node.module.split(".")[0]
                      if top not in STDLIB and top not in ALLOWLIST:
                          violations.append(f"{f.name}:{node.lineno} — {node.module}")

          if violations:
              print("FAIL: non-stdlib imports found in espalier/scanners/:")
              for v in violations:
                  print(" ", v)
              sys.exit(1)
          scanners = len(list(Path("espalier/scanners").glob("*.py"))) - 1
          print(f"OK: all {scanners} scanners are stdlib-only")

  code-review-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Run review audit (full mode)
        run: python tools/review_agent_audit.py --mode full

  artifact-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install build + editable project
        run: |
          # setuptools is explicit: Python 3.12+ venvs no longer bundle it, and
          # the artifact-parity build backend (setuptools.build_meta) needs it —
          # without it the skip-guard hard-fails instead of running the check.
          pip install build pytest setuptools
          pip install -e .

      - name: Run structural parity check (unit)
        run: python -m pytest tests/test_artifact_parity.py -q

      - name: Run structural parity check (integration)
        shell: python
        run: |
          import json, sys
          from pathlib import Path
          from espalier.artifact_parity import check_source_vs_wheel

          report = check_source_vs_wheel(Path("."))
          print(json.dumps(report, indent=2))
          if not report["parity"]:
              print("ARTIFACT PARITY FAILED", file=sys.stderr)
              for d in report["diffs"]:
                  print(" -", d, file=sys.stderr)
              sys.exit(1)
          print("artifact-parity OK")

  workflow-lint:
    # Durable guard: statically lint every workflow YAML so a
    # job-context / expression error can NEVER ship invisibly again. The
    # concrete bug: `hashFiles()` in a job-level `if:` is illegal (only valid in
    # step contexts), so GitHub rejected harness-guard.yml at parse time and
    # created ZERO jobs — the adopter-facing `verify` gate was dead on arrival
    # and nothing caught it because no workflow YAML was ever linted. This is
    # the mechanical oracle that would have caught it on day one.
    #
    # Self-host dev-infra only (test.yml is not deployed by `espalier
    # install-ci`; adopters receive only harness-guard.yml + ci_guard.py).
    # shellcheck + pyflakes integration is OFF: this gate targets actionlint's
    # own expression/context checks, not the cosmetic shell-style infos
    # (SC2012/SC2181) in release.yml / refresh-externals.yml, which are a
    # separate scope decision.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install actionlint
        # Official download script, pinned to a release tag for reproducibility;
        # it fetches the matching binary from actionlint's GitHub releases.
        run: |
          curl -sSfL -o download-actionlint.bash \
            https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash
          bash download-actionlint.bash 1.7.7

      - name: Lint workflow YAML (expression/context checks)
        run: ./actionlint -shellcheck= -pyflakes= -color
