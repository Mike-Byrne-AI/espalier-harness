name: CI

# Pull requests only (plus a manual dispatch): every signal this workflow
# produces is read BEFORE the merge, on the PR's merge result, and main never
# re-runs it. The pairing of two PRs merged in sequence was covered here by
# the protection's up-to-date rule from 2026-09-27 to 2026-10-09: the second
# was caught up to main before it merged, at one `gh pr update-branch` and a
# marker re-bind per trailing PR. Since the rule went off the pairing is
# proved after the merge, by post-merge.yml on main, and a red one is reverted
# first (root CLAUDE.md Core Rule 15; a pre-registered re-measure decides
# whether the rule comes back). This paragraph is hand-kept -- nothing here reads the live
# protection; the SessionStart banner prints it. The `tier` job below
# decides how much of the suite a PR earns; the required `test (3.x)` cells
# then run exactly that minus its serial leg, their required `test-serial (3.x)`
# twins run that leg beside them (the files scripts/proof_tier.py::SERIAL_FILES
# names, alone on their own runner; in series with the parallel run the leg
# took 8 to 14 minutes of every cell until 2026-09-30), and a changed test
# file always rides along, whatever the tier.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Read-only token; the test job never pushes.
permissions:
  contents: read

# Cancel previous CI run on the same ref when a new push lands.
concurrency:
  # Each EVENT gets its own group, so a run of one kind cannot cancel a run of
  # another on the same ref. The original case was a scheduled run -- it
  # executes on the default branch, so `github.ref` matches a push's and
  # `cancel-in-progress` let a push landing at the wrong minute kill it. The
  # property holds for `workflow_dispatch` too: a dispatched run shares the
  # push's ref, and a cancelled run is not a failed run -- nothing reports
  # that it did not happen.
  #
  # KEY ON THE EVENT ITSELF, never on a hand-written list of event names. The first
  # spelling here enumerated only `schedule` and let everything else fall through to
  # `push`, which put `workflow_dispatch` in the push bucket, and on 2026-09-01 a
  # manual dispatch cancelled an in-flight push run. The release checklist tells the
  # operator to dispatch these legs by hand, so the collision was reachable by
  # following the documented procedure. `github.event_name` cannot drift out of
  # step with a sibling condition because there is no second copy to maintain.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # ONE computation, the same one the local run prints: scripts/proof_tier.py
  # classifies the pull request's merge-base diff. A docs/tests/scripts change
  # earns the contract slice (minutes); a recall-corpus change earns that slice
  # plus the recall engine's own files; a runtime or workflow change earns the
  # full tier -- the parallel recipe the local `proof_tier.py --run` uses, with
  # the files scripts/proof_tier.py::SERIAL_FILES names kept off its pool and
  # run at one worker (the `test-serial` cells below). The rule has one home
  # (the script, pinned by tests/test_proof_tier.py); this job only asks it.
  #
  # This job NEVER fails and never answers cheaper than the truth: a script
  # error, a shallow history, a dispatch with no PR base -- every one of those
  # reads as `full`, the tier that contains the other two. The `test` matrix
  # consumes the output through `needs` and defaults to `full` when the output
  # is empty, so the four required cells always report whatever happens here.
  tier:
    runs-on: ubuntu-latest
    outputs:
      tier: ${{ steps.compute.outputs.tier }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The merge-base with the PR base must be reachable.
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Compute the proof tier this pull request earns
        id: compute
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          tier=full
          if [ -n "$BASE_SHA" ]; then
            tier="$(python scripts/proof_tier.py --base "$BASE_SHA" --quiet || echo full)"
          fi
          case "$tier" in
            full|recall|contract) ;;
            *) tier=full ;;
          esac
          echo "tier=$tier" >> "$GITHUB_OUTPUT"
          {
            echo "## proof tier: \`$tier\`"
            echo
            echo '```'
            python scripts/proof_tier.py --base "${BASE_SHA:-HEAD}" --tier "$tier" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    needs: tier
    # Run even if `tier` errored: a required cell that never reports parks the
    # PR (see the matrix comment below). The env default covers an empty output.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # A hang the per-test ceiling cannot reach ends here, not at GitHub's
    # 360-minute default (DEF-1178): 1.5x the worst of the last 20 green runs,
    # 57.2 min (median 37.8, 2026-11-09, scripts/ci_job_bounds_census.py).
    timeout-minutes: 90
    strategy:
      # A LITERAL four-cell list, never a `${{ }}` expression: branch protection
      # matches check-run names, the release checklist requires `test (3.11)`
      # ... `test (3.14)`, and tests/test_required_status_checks.py cannot model
      # a computed matrix. A required check that never reports does not fail a
      # PR, it parks it on "Expected -- waiting for status to be reported" with
      # no route to merge but deleting the rule.
      #
      # Read every cell: a red in one interpreter must not cancel the other four
      # (the 2026-09-24 witness lost three clean-checkout cells to fail-fast on
      # one runner-relative red, DEF-922). These four cells are the required
      # status checks, so a cancelled cell is a check that never reports.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Keep the temp dir on the runner's disk
        # GitHub's AWS pool mounts /tmp as a 7.7G tmpfs with usrquota, and this
        # leg's base temp filled the runner user's quota there: Errno 122 at 6.1G
        # (#470's test (3.13), 2026-11-03), where the same leg reaches 11G on the
        # Azure pool, whose /tmp is the root disk. $RUNNER_TEMP is on the root
        # disk on both pools (the AWS cell's 72G root had 19G free before the
        # tier; a job running both legs there is unmeasured, and the disk steps
        # below read it). First, before anything writes a temp file, and made,
        # not only named: tempfile.gettempdir() passes over a TMPDIR that is not a
        # directory and settles on /tmp without a word. Every Linux job that runs
        # the suite opens with this step (tests/test_ci_job_bounds.py, DEF-3027).
        run: |
          mkdir -p "$RUNNER_TEMP/tmp"
          echo "TMPDIR=$RUNNER_TEMP/tmp" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history and tags, so the tests that read past commits RUN here
          # rather than skip: the CHANGELOG tag-parity test reads the release
          # tags (tests/test_verify_pins.py, which drives its controls against
          # commits on main, runs in test-serial below). The calibration class in
          # tests/test_sister_site_probe_regression.py needs no history: it reads
          # its corpus from tests/fixtures/pre_pack_tp104/, so it runs here and in
          # every public clone.
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e .[dev]

      - name: Read the runner's disk before the tier
        # PR #464's parallel leg ended in Errno 122 (disk quota exceeded) on
        # every cell GitHub placed on its AWS pool and on none of the Azure
        # pool's (2026-11-03); these two steps measured why (the first step's
        # comment), and now read where the temp dir lives after that step moved
        # it: findmnt of $TMPDIR is the root disk on both pools, so every cell
        # shows the move, and a warning annotation says so where the temp dir's
        # mount still carries usrquota or prjquota (the move missed the quota).
        # Errno 122 is a quota, so where findmnt's OPTIONS list one, df's Avail
        # is not the runner user's headroom: read the quota reports. A sampler
        # logs the temp dir's filesystem every 20 s through the tier, so the
        # peak is read and not only what the run left. Neither step can fail
        # the cell, and the tier step itself never carries continue-on-error
        # (tests/test_required_status_checks.py).
        continue-on-error: true
        run: |
          echo "image: $ImageOS $ImageVersion; vendor: $(cat /sys/class/dmi/id/sys_vendor 2>/dev/null)"
          tmp="${TMPDIR:-/tmp}"
          findmnt -T "$tmp" -o TARGET,SOURCE,FSTYPE,SIZE,OPTIONS || true
          if findmnt -n -o OPTIONS -T "$tmp" 2>/dev/null | grep -qE 'usrquota|prjquota'; then
            echo "::warning title=temp dir on a quota'd mount::$tmp is on a mount with a quota option; image $ImageOS $ImageVersion"
          fi
          findmnt -T "$GITHUB_WORKSPACE" -o TARGET,SOURCE,FSTYPE,SIZE,OPTIONS || true
          df -h || true
          df -i || true
          sudo -n repquota -as 2>&1 | head -20
          sudo -n xfs_quota -x -c 'report -h -ubgp' 2>&1 | head -20
          nohup sh -c 'while sleep 20; do echo "$(date +%T) $(df --output=used,iused,avail "$0" | tail -1)"; done' "$tmp" > "$RUNNER_TEMP/disk-trace.txt" 2>&1 &

      - name: Run the proof tier this pull request earns
        id: tier
        # `proof_tier.py --run` executes the tier's own recipe under one receipt:
        # contract = the tree-wide contracts; recall = those plus the recall
        # engine's files; every tier opens with `ruff check .` below the type
        # gate where there is one; full = mypy on the hooks, ruff, then `pytest -n auto`
        # with the serial files (proof_tier.py::SERIAL_FILES) left out.
        # `--leg parallel` is every line but the serial one (the whole tier on
        # the cheaper tiers); the serial line runs in the `test-serial` twin
        # below, on its own runner. The `heavy_e2e` stages
        # (tests/conftest.py::_HEAVY_E2E_TESTS) run in no
        # cell here: every pytest line deselects them (the cheaper tiers' own-tests
        # line included), and their one CI home is
        # the floor-version cell of clean-checkout.yml (`--heavy`). A dispatch
        # has no PR base and runs `full` against HEAD.
        env:
          TIER: ${{ needs.tier.outputs.tier || 'full' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PYTEST_ADDOPTS: --durations=25
        run: |
          echo "proof tier: $TIER"
          python scripts/proof_tier.py --run --tier "$TIER" --base "${BASE_SHA:-HEAD}" --leg parallel

      - name: Read the runner's disk after the tier
        # Runs after a red tier too, and there says so in an annotation, which
        # `gh run view` prints beside a failed log (this step never fails).
        # The du lines name the largest folders under pytest's base temp,
        # down to a test's own dir.
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 5
        run: |
          tmp="${TMPDIR:-/tmp}"
          df -h "$tmp" "$GITHUB_WORKSPACE" || true
          df -i "$tmp" "$GITHUB_WORKSPACE" || true
          echo "the temp dir's filesystem every 20 s through the tier (used KB, inodes used, avail KB):"
          tail -n 60 "$RUNNER_TEMP/disk-trace.txt" 2>/dev/null || true
          timeout 120 du -xh --max-depth=4 "$tmp/pytest-of-$(id -un)" 2>/dev/null | sort -h | tail -12
          timeout 60 du -xsh "$GITHUB_WORKSPACE" "$HOME/.cache" 2>/dev/null || true
          if [ "${{ steps.tier.outcome }}" = "failure" ]; then
            echo "::warning title=runner disk after a red tier::$(df -h "$tmp" | tail -1); image $ImageOS $ImageVersion"
          fi

      - name: Self-host check
        # --skip-self-host is belt-and-suspenders, NOT load-bearing for
        # classification: a fresh checkout classifies as source_checkout (the
        # self-host marker is gitignored .espalier/integrity.json, not the
        # committed .espalier/ dir), so the self-host strict gate never
        # false-fires here.
        run: espalier doctor . --skip-self-host

  # The serial leg of the tier -- the files scripts/proof_tier.py::SERIAL_FILES
  # names (the lists it joins say why each file is there) -- on its own runner,
  # beside the parallel leg instead of after it. Those files false-fail under
  # CPU oversubscription, or launch a nested pytest run that the nested-run
  # rule in tests/test_proof_tier.py keeps off the pool, which is why they
  # never join the `-n auto` run; alone on a runner they run at their serial
  # duration. Five required cells, the same
  # literal matrix as `test` and for the same reasons: branch protection
  # matches check-run names, and a cell that never reports parks the PR. On the
  # cheaper tiers the leg has nothing to run and says so in the receipt (exit
  # 0), so the required cell still reports.
  test-serial:
    needs: tier
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # DEF-1178: above the measured worst case, 7.0 min (18 runs to 2026-10-16),
    # and ten minutes above the largest per-test timeout in the serial files
    # (1800 s, the module mark of tests/test_verify_pins.py, a serial file since
    # DEF-2036), so a slow test is failed by its own mark, by name, before the job
    # is killed with none named (tests/test_ci_job_bounds.py derives the floor).
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Keep the temp dir on the runner's disk
        # The `test` job's first step says why (DEF-3027).
        run: |
          mkdir -p "$RUNNER_TEMP/tmp"
          echo "TMPDIR=$RUNNER_TEMP/tmp" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history: tests/test_verify_pins.py, a serial file since
          # DEF-2036, drives its controls against commits on main and skips
          # them on a shallow tree (tests/test_ci_job_bounds.py pins the depth).
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        # Only where the leg has something to run: on the cheaper tiers the
        # serial leg is empty and the script is stdlib, so four required cells
        # skip the install on a docs-only pull request (failure-mode review).
        if: ${{ (needs.tier.outputs.tier || 'full') == 'full' }}
        run: pip install -e .[dev]

      - name: Run the serial leg of the proof tier this pull request earns
        env:
          TIER: ${{ needs.tier.outputs.tier || 'full' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PYTEST_ADDOPTS: --durations=25
        run: |
          echo "proof tier: $TIER (serial leg)"
          python scripts/proof_tier.py --run --tier "$TIER" --base "${BASE_SHA:-HEAD}" --leg serial

  # The perturbed cell: the parallel leg of the tier this pull request earns,
  # on a host shaped like ones adopters bring and no other cell is. `python3`
  # on PATH is a Microsoft Store alias stub that prints the alias's not-found
  # text and exits 49 (9009 on Windows), and `python` answers. Every other cell
  # answers both names, so a fixture or a script that spells `python3` stays
  # green there and reds here. Its pytest root holds a space (`--basetemp` on
  # the tier step, under the job's TMPDIR): under one the suite red 155 tests
  # in nine files until DEF-5082's lane quoted the fixtures' temp paths for
  # their shells (measured 2026-11-03, fixed 2026-11-04). NOT a required
  # check: it lands non-required, and
  # promoting it is the operator's call after a run of greens, because a
  # required name that never reports parks every pull request
  # (tests/test_required_status_checks.py). Its row in tests/_axis_registry.py's
  # INSTRUMENTS is read against these steps.
  perturbed:
    needs: tier
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # The `test` cells' leg on one interpreter, measured on its own: 1.5x the
    # worst of its last 20 green runs, 58.0 min (2026-11-09, the bounds census).
    timeout-minutes: 90

    steps:
      - name: Keep the temp dir on the runner's disk
        # The `test` job's first step says why (DEF-3027).
        run: |
          mkdir -p "$RUNNER_TEMP/tmp"
          echo "TMPDIR=$RUNNER_TEMP/tmp" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history and tags, as the `test` cells check out.
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e .[dev]

      - name: Put a Store-alias python3 first on PATH
        # tests/_interpreter_hosts.py's store_python3 host in its sh flavour,
        # built after the install so pip ran unperturbed: `python3` is the
        # stub, and `python` execs the interpreter this step runs. A line in
        # $GITHUB_PATH goes ahead of PATH for every later step.
        run: |
          bin="$(python -c "import os; from pathlib import Path; from tests._interpreter_hosts import build_host, STORE_PYTHON3, SH; print(build_host(Path(os.environ['RUNNER_TEMP']) / 'axis hosts', STORE_PYTHON3, SH))")"
          echo "$bin" >> "$GITHUB_PATH"

      - name: Read the perturbed host before the tier
        # Resolved on the PATH the tier step gets, never the PATH of the step
        # that built the host: a probe that reads its own process's PATH can
        # report the shim absent while it is in force. A host
        # that is not the stub host fails the cell here, so the tier never
        # runs unperturbed under this cell's name.
        run: |
          case "$(command -v python3)" in "$RUNNER_TEMP/axis hosts/"*) ;; *) echo "::error::python3 resolves to $(command -v python3), not the stub host"; exit 1;; esac
          case "$(command -v python)" in "$RUNNER_TEMP/axis hosts/"*) ;; *) echo "::error::python resolves to $(command -v python), not the stub host"; exit 1;; esac
          rc=0; python3 -c pass 2>/dev/null || rc=$?
          [ "$rc" = 49 ] || { echo "::error::python3 exited $rc, not the Store stub's 49"; exit 1; }
          python -c 'import espalier, sys; print("python answers:", sys.executable)'

      - name: Run the proof tier's parallel leg on the perturbed host
        # The spaced root is `--basetemp "$RUNNER_TEMP/tmp/axis basetemp/bt"`
        # (its parent made first: pytest makes only the leaf): on each pytest
        # line's argv inside proof_tier, never into PYTEST_ADDOPTS, which a
        # pytest child a test launches inherits, and pytest empties an
        # explicit basetemp before it uses it, so the child would delete every
        # xdist worker's directories under it (proof_tier.py::_with_basetemp);
        # inside the TMPDIR the first step exports, where a nested run takes
        # its basetemp inside its parent's (tests/_nested_temp.py). On the full
        # tier the leg leaves out proof_tier.py::SERIAL_FILES, which then never
        # run on this host; on the cheaper tiers a changed serial file rides
        # this leg at one worker.
        env:
          TIER: ${{ needs.tier.outputs.tier || 'full' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PYTEST_ADDOPTS: --durations=25
        run: |
          echo "proof tier: $TIER (parallel leg, perturbed host, spaced root)"
          mkdir -p "$RUNNER_TEMP/tmp/axis basetemp"
          python scripts/proof_tier.py --run --tier "$TIER" --base "${BASE_SHA:-HEAD}" --leg parallel --basetemp "$RUNNER_TEMP/tmp/axis basetemp/bt"

  # The tagless-clone job lives in its own workflow
  # (.github/workflows/clean-checkout.yml), on the floor interpreter, with the
  # heavy stages: a required cell's re-run never waits on it, and four
  # full-suite executions per pull request went with it (2026-09-30).

  # The cross-OS `portability` job lives in its own workflow
  # (.github/workflows/portability.yml): it runs on a pull request when Python
  # or packaging source changes, and on demand. The static portability
  # contracts still run here on ubuntu on every pull request.

  # The ONLY job that installs ripgrep, and the sole environment in which the
  # rg-vs-python parity assertions execute at all.
  #
  # tests/test_scope_walker.py gates three tests on `shutil.which("rg")` and
  # NOTHING installed it anywhere -- so a backend reachable from shipped code
  # (`walk_references(..., use_ripgrep=True)` is the default, reached by
  # `espalier scope-check`) had its only coverage skip in every environment the
  # project controls. A green suite said nothing about it.
  #
  # Placement is deliberate, and the two obvious homes are both WRONG:
  #  - NOT `clean-checkout`: that job exists to reproduce a fresh-contributor
  #    clone, which does not have ripgrep. Installing it there would destroy the
  #    very environment the job is there to represent.
  #  - NOT `test`: that is a 4-interpreter matrix, and this parity is about two
  #    search backends agreeing, not about interpreter behaviour -- one runner
  #    proves it, four just pay for it 4x.
  # An apt-get in the `test` matrix would also exercise nothing on the cheaper
  # tiers: these tests carry the `slow` marker, which the contract slice never
  # selects, and the full tier's cells have no ripgrep to find.
  ripgrep-parity:
    runs-on: ubuntu-latest
    # DEF-1178: above the measured worst case, 0.8 min (18 runs to 2026-10-16).
    timeout-minutes: 10
    steps:
      - name: Keep the temp dir on the runner's disk
        # The `test` job's first step says why (DEF-3027).
        run: |
          mkdir -p "$RUNNER_TEMP/tmp"
          echo "TMPDIR=$RUNNER_TEMP/tmp" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e .[dev]

      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Confirm rg resolves (this is the gate the tests skip on)
        # Fail loudly here rather than let the suite skip silently: a skipped
        # parity test in the job that exists to run it is the exact failure
        # this job was added to end.
        run: |
          rg --version
          python -c "import shutil,sys; sys.exit(0 if shutil.which('rg') else 'rg not on PATH')"

      - name: Run the ripgrep parity tests
        # `-rs` so a skip is visible in the log; combined with the check above,
        # a skip here means the gate regressed rather than the tool is absent.
        run: python -m pytest tests/test_scope_walker.py -q -rs

  stdlib-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Check scanners are stdlib-only
        shell: python
        run: |
          import ast
          import sys
          from pathlib import Path

          STDLIB = sys.stdlib_module_names
          ALLOWLIST = {
              "os", "re", "sys", "ast", "json", "math", "pathlib", "typing",
              "collections", "itertools", "functools", "dataclasses",
              "abc", "enum", "io", "copy", "string", "textwrap", "warnings",
              "contextlib", "types", "operator", "hashlib", "struct",
              "__future__",
          }

          violations = []
          for f in Path("espalier/scanners").glob("*.py"):
              if f.name == "__init__.py":
                  continue
              tree = ast.parse(f.read_text())
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      for alias in node.names:
                          top = alias.name.split(".")[0]
                          if top not in STDLIB and top not in ALLOWLIST:
                              violations.append(f"{f.name}:{node.lineno} — {alias.name}")
                  elif isinstance(node, ast.ImportFrom):
                      if not node.module:
                          continue
                      top = node.module.split(".")[0]
                      if top not in STDLIB and top not in ALLOWLIST:
                          violations.append(f"{f.name}:{node.lineno} — {node.module}")

          if violations:
              print("FAIL: non-stdlib imports found in espalier/scanners/:")
              for v in violations:
                  print(" ", v)
              sys.exit(1)
          scanners = len(list(Path("espalier/scanners").glob("*.py"))) - 1
          print(f"OK: all {scanners} scanners are stdlib-only")

  code-review-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Run review audit (full mode)
        run: python tools/review_agent_audit.py --mode full

  artifact-parity:
    runs-on: ubuntu-latest
    # DEF-1178: above the measured worst case, 0.8 min (18 runs to 2026-10-16).
    timeout-minutes: 10
    steps:
      - name: Keep the temp dir on the runner's disk
        # The `test` job's first step says why (DEF-3027).
        run: |
          mkdir -p "$RUNNER_TEMP/tmp"
          echo "TMPDIR=$RUNNER_TEMP/tmp" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Install build + editable project
        run: |
          # setuptools is explicit: Python 3.12+ venvs no longer bundle it, and
          # the artifact-parity build backend (setuptools.build_meta) needs it —
          # without it the skip-guard hard-fails instead of running the check.
          pip install build pytest setuptools
          pip install -e .

      - name: Run structural parity check (unit)
        run: python -m pytest tests/test_artifact_parity.py -q

      - name: Run structural parity check (integration)
        shell: python
        run: |
          import json, sys
          from pathlib import Path
          from espalier.artifact_parity import check_source_vs_wheel

          report = check_source_vs_wheel(Path("."))
          print(json.dumps(report, indent=2))
          if not report["parity"]:
              print("ARTIFACT PARITY FAILED", file=sys.stderr)
              for d in report["diffs"]:
                  print(" -", d, file=sys.stderr)
              sys.exit(1)
          print("artifact-parity OK")

  workflow-lint:
    # Durable guard: statically lint every workflow YAML so a
    # job-context / expression error can NEVER ship invisibly again. The
    # concrete bug: `hashFiles()` in a job-level `if:` is illegal (only valid in
    # step contexts), so GitHub rejected harness-guard.yml at parse time and
    # created ZERO jobs — the adopter-facing `verify` gate was dead on arrival
    # and nothing caught it because no workflow YAML was ever linted. This is
    # the mechanical oracle that would have caught it on day one.
    #
    # Self-host dev-infra only (test.yml is not deployed by `espalier
    # install-ci`; adopters receive only harness-guard.yml + ci_guard.py).
    # shellcheck + pyflakes integration is OFF: this gate targets actionlint's
    # own expression/context checks, not the cosmetic shell-style infos
    # (SC2012/SC2181) in release.yml / refresh-externals.yml, which are a
    # separate scope decision.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install actionlint
        # Official download script, pinned to a release tag for reproducibility;
        # it fetches the matching binary from actionlint's GitHub releases.
        run: |
          curl -sSfL -o download-actionlint.bash \
            https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash
          bash download-actionlint.bash 1.7.7

      - name: Lint workflow YAML (expression/context checks)
        run: ./actionlint -shellcheck= -pyflakes= -color
