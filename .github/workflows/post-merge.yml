name: Post-merge proof
# The merged combination on main, proved once per push. A pull request runs the
# tier it earns against its own base (test.yml); without branch protection's
# up-to-date rule, two pull requests, each green on its own base, can red
# together on main, and this run is where that shows. `tools/cc/ship.py
# preflight` names a red one before the next lane lands on top of it.
#
# One interpreter and both legs in one job, on purpose. The per-push full-suite
# run this repository dropped on 2026-09-25 ran in every cell, gated nothing and
# competed with the required cells for the runner pool; under the up-to-date rule
# the pull request's own run already proved the merged combination, so it was
# redundant. Without that rule it is the only proof of the combination, and one
# job is enough to carry it. It gates nothing either: it runs after the merge.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only token; the job never pushes.
permissions:
  contents: read

# No concurrency group, on purpose: each push's run proves its own tip to the
# end, beside the next one. A run takes over an hour (median 77.2 minutes over
# the last 20 greens, 2026-11-14; 65.2 on 2026-11-12, 59 on 2026-11-08) and
# merges can land closer together than that, so cancelling the older run on a
# newer push left main with no verdict through whole stretches (DEF-2015: 8 of
# 23 runs cancelled on 2026-10-15), and a red then named every merge since the
# last green. A group without the cancel does not help: GitHub keeps one pending
# run per group and cancels an older pending one when a newer one queues.

jobs:
  full-tier:
    runs-on: ubuntu-latest
    # DEF-1178's rule, re-measured by scripts/ci_job_bounds_census.py: 1.5x the
    # worst of the last 20 green runs, 92.2 min (median 77.2, 2026-11-14; 88.1 on
    # 2026-11-12, 86.6 on 2026-11-11, and 70.7 on 2026-11-08, when the 75 before
    # 110 cut 2 runs with no verdict), so 140; the bound is that plus 15 minutes,
    # the operator's ruling of 2026-11-14, which trades 15 more minutes on a hung
    # run for fewer raises as the suite grows. It also holds the floor every job
    # that runs the serial files keeps (DEF-2038, tests/test_ci_job_bounds.py):
    # their worst mark, 1800 s, plus that worst.
    timeout-minutes: 155
    steps:
      - name: Keep the temp dir on the runner's disk
        # test.yml's `test` job's first step says why (DEF-3027): on GitHub's
        # AWS pool /tmp is a quota'd tmpfs this run's parallel leg would fill.
        run: |
          mkdir -p "$RUNNER_TEMP/tmp"
          echo "TMPDIR=$RUNNER_TEMP/tmp" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history and tags, as test.yml's cells fetch, so the tests
          # that read past commits or release tags run here rather than skip.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e .[dev]

      - name: Run the full tier, both legs
        # The same recipe a full-tier pull request runs across its parallel and
        # serial cells, here in sequence on one runner.
        env:
          PYTEST_ADDOPTS: --durations=25
        run: python scripts/proof_tier.py --run --tier full
