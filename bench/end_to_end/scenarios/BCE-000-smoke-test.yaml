id: BCE-000-smoke-test
description: |
  Validates the bench harness itself end-to-end: scenario YAML parses,
  runner.py launches Claude Code as a subprocess, transcript.py parses
  the stream-json output, assertions.py evaluates a trivial property.

  This scenario must pass deterministically (10/10 runs). Any failure
  means the harness is broken, not the agent — distinguish from
  scenario-specific failures by always running BCE-000 first.
in_scope: true
verifies: "End-to-end harness produces a non-empty transcript with at least one assistant turn."

setup:
  files: []
  git_init: false
  copy_hooks: false

trigger:
  type: prompt
  content: |
    What is 2 + 2?

expected_receiver_behavior:
  must_contain_any:
    - "4"
  max_turns: 2
  # The CLI-drift canary: the stream still carries the init event and the
  # priced result event the bench reads, so a renamed field reds here first.
  stream_well_formed: true

flakiness_handling:
  retry_on_inconclusive: 0
  treat_inconclusive_as: fail

# Advisory, not enforced (SCHEMA.md): one run measured 16,373 tokens, most of
# them cache reads, on 2026-10-14 (Claude Code 2.1.299, claude-opus-5-5).
cost_budget_tokens: 20000
